[project]
name = "prop-challenge-lab"
version = "0.1.0"
description = "Deterministic dollar-denominated evaluation harness (private, local-only)"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["pandas>=2.0", "numpy>=1.26"]

[project.scripts]
occams-verdict = "occams.verdict_cli:main"

[project.optional-dependencies]
# scipy is a TEST-ONLY oracle for occams/stats.py. It is deliberately NOT a
# runtime dependency: occams/ is imported by the Lambda and its dependency
# weight already broke a build once (B0.3). Testing our own implementation
# against scipy is also stronger than calling scipy, because it pins OUR
# behaviour — a future scipy release cannot silently move a number that is
# already in the register.
# pyarrow backs `scripts/to_parquet.py` (the derived bar layer, B1). It was
# used and never declared, so anyone installing only the stated dependencies
# hit an ImportError -- found by CI, on the first run, which is the argument
# for having CI.
#
# ruff is PINNED, not floored. `>=0.4` resolved to 0.15 locally and 0.16 in
# CI, whose wider defaults flagged 235 E402s and 35 I001s in code that
# passes here -- a lint failure caused entirely by two machines disagreeing
# about what the rules are. A linter that drifts cannot gate anything.
dev = ["pytest>=8.0", "ruff==0.15.12", "scipy>=1.11", "matplotlib>=3.8",
       "pyarrow>=15.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The `reproduction` tier re-scores REAL archived results end to end and
# needs 2 GB of vendor bars plus S3. It is excluded from the default run so
# `make check` stays fast, and wired to `make reproduce`, which is the gate
# before any archived number is cited or published. Tier 1 of
# tests/test_reproduction.py is NOT marked and always runs -- it pins the
# engine itself, which is the only way an archived number can move.
addopts = "-q -m 'not reproduction'"
markers = [
  "reproduction: re-scores archived results end to end (needs data + S3)",
]

[tool.ruff]
line-length = 88
target-version = "py312"
# Experiment scripts are FROZEN EVIDENCE. `scripts/exp_*.py` are archived
# byte-for-byte as the artifact that produced a registered result, so
# reformatting one would break the guarantee that the archived copy is the
# script that ran. They are excluded from lint deliberately, not lazily.
extend-exclude = ["scripts/exp_*.py"]

[tool.ruff.lint]
# STATED, not inherited. With no `select` the rule set is whatever the
# installed ruff happens to default to, which is how a version bump turned
# a passing tree into 235 errors without a line of code changing. These are
# the classic defaults (pycodestyle errors + pyflakes) -- the same set that
# has always been enforced here, now written down so it is a decision of
# this repository rather than a property of somebody's virtualenv.
select = ["E4", "E7", "E9", "F"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["occams*"]
